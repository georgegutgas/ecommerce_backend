spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/ecommercedb
        username: postgres
        password: admin
        driver-class-name: org.postgresql.Driver

jpa:
    hibernate:
      ddl-auto: validate # Mantiene la estructura de tablas que creaste con el script SQL
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
    port: 8080


